title: ACM SIGMOD Blog
description: >-
  Catching the heartbeat of the data management community: perspectives on
  exciting and controversial topics, from and for the ACM SIGMOD community.
url: "https://blog.sigmod.org"
baseurl: ""

editors_page: /editors/
sigmod_url: "https://sigmod.org"

# Page view counts: https://sigmod-blog.goatcounter.com (only counted on the live site).
goatcounter: sigmod-blog

timezone: UTC
permalink: /:year/:month/:day/:title/
paginate: 10
paginate_path: "/page/:num/"

include: [_pages]
exclude: [README.md, SUBMITTING.md, CLAUDE.md, tools, Gemfile, Gemfile.lock, vendor, .bundle]

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "_pages" }
    values: { layout: page }
